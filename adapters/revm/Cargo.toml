# Adapter of the revm-based Satin implementation (mega-evm, on MegaETH's revm fork) to the fixture
# format. Its own workspace: the root workspace holds the format crate alone, which depends on no
# engine; this crate depends on the format crate, never the other way round.
[workspace]

[package]
name = "mega-eest-adapter-revm"
description = "Runs mega-execution-fixture cases on the revm-based Satin implementation."
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "adapter-revm"
path = "src/main.rs"

[dependencies]
# The wire contract: strict JSON and the fixture model.
mega-fixture-format = { path = "../../crates/mega-fixture-format" }

# The implementation, pinned by commit (adapters/implementations.env: REVM_IMPL_REV).
mega-evm = { git = "https://github.com/megaeth-labs/mega-evm", rev = "1a981f4b8a3298ead9df15b237f5632bb36bc41d", features = ["test-utils"] }

# The versions mega-evm's own root manifest pins at that revision.
revm = { version = "=40.0.3" }
op-revm = { git = "https://github.com/ethereum-optimism/optimism", rev = "f67d87cd5c9992b62d215c043917b94e3f019629" }
alloy-consensus = { version = "2.0.5" }
alloy-eips = { version = "2.0.5" }
alloy-evm = { version = "0.36.0" }
alloy-op-evm = { git = "https://github.com/ethereum-optimism/optimism", rev = "f67d87cd5c9992b62d215c043917b94e3f019629" }
alloy-primitives = { version = "1.6.0" }
alloy-rlp = { version = "0.3" }
op-alloy-consensus = { git = "https://github.com/ethereum-optimism/optimism", rev = "f67d87cd5c9992b62d215c043917b94e3f019629" }

# Patches are not inherited from a dependency: these repeat the blocks of mega-evm's own root
# Cargo.toml at the pinned revision.
[patch.crates-io]
revm = { git = "https://github.com/megaeth-labs/revm", rev = "2b71cb617f9cb401cf62f78df48e142d13eaf7de" }
revm-primitives = { git = "https://github.com/megaeth-labs/revm", rev = "2b71cb617f9cb401cf62f78df48e142d13eaf7de" }
revm-interpreter = { git = "https://github.com/megaeth-labs/revm", rev = "2b71cb617f9cb401cf62f78df48e142d13eaf7de" }
revm-context = { git = "https://github.com/megaeth-labs/revm", rev = "2b71cb617f9cb401cf62f78df48e142d13eaf7de" }
revm-context-interface = { git = "https://github.com/megaeth-labs/revm", rev = "2b71cb617f9cb401cf62f78df48e142d13eaf7de" }
revm-handler = { git = "https://github.com/megaeth-labs/revm", rev = "2b71cb617f9cb401cf62f78df48e142d13eaf7de" }
revm-database = { git = "https://github.com/megaeth-labs/revm", rev = "2b71cb617f9cb401cf62f78df48e142d13eaf7de" }
revm-database-interface = { git = "https://github.com/megaeth-labs/revm", rev = "2b71cb617f9cb401cf62f78df48e142d13eaf7de" }
revm-state = { git = "https://github.com/megaeth-labs/revm", rev = "2b71cb617f9cb401cf62f78df48e142d13eaf7de" }
revm-bytecode = { git = "https://github.com/megaeth-labs/revm", rev = "2b71cb617f9cb401cf62f78df48e142d13eaf7de" }
revm-precompile = { git = "https://github.com/megaeth-labs/revm", rev = "2b71cb617f9cb401cf62f78df48e142d13eaf7de" }
revm-inspector = { git = "https://github.com/megaeth-labs/revm", rev = "2b71cb617f9cb401cf62f78df48e142d13eaf7de" }

[patch."https://github.com/ethereum-optimism/optimism"]
op-revm = { git = "https://github.com/megaeth-labs/op-revm", rev = "8c0db939291e1c4cbf2375782d1483bc371d6b94" }
